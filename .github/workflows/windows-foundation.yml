name: Windows foundation build

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  windows:
    name: Analyze, test and build (Windows)
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Restore Flutter SDK and Dart packages cache
        id: flutter-setup
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
          pub-cache: true
          cache-key: "flutter-sdk-:os:-:channel:-:version:-:arch:"
          pub-cache-key: "flutter-pub-:os:-:channel:-:version:-:arch:-:hash:"

      - name: Show dependency cache status
        shell: pwsh
        env:
          FLUTTER_CACHE_HIT: ${{ steps.flutter-setup.outputs.CACHE-HIT }}
          PUB_CACHE_HIT: ${{ steps.flutter-setup.outputs.PUB-CACHE-HIT }}
        run: |
          Write-Host "Flutter SDK cache hit: $env:FLUTTER_CACHE_HIT"
          Write-Host "Dart Pub cache hit:    $env:PUB_CACHE_HIT"

      - name: Record toolchain
        shell: pwsh
        run: |
          flutter --version
          dart --version
          flutter doctor -v
          flutter config --enable-windows-desktop

      - name: Run metadata and packaging preparation unit tests
        run: python -m unittest discover -s scripts -p "test_*.py" -v

      - name: Generate and brand the official Windows runner
        shell: pwsh
        run: |
          ./scripts/prepare_windows.ps1
          python scripts/patch_windows_metadata.py --check
          if ($LASTEXITCODE -ne 0) { throw 'Windows native metadata validation failed' }
          git diff --exit-code -- lib test pubspec.yaml analysis_options.yaml
          if ($LASTEXITCODE -ne 0) { throw 'Windows bootstrap modified hand-written source files' }

      - name: Resolve dependencies
        run: flutter pub get

      - name: Format Dart sources for CI verification
        run: dart format lib test

      - name: Static analysis
        run: flutter analyze

      - name: Unit and widget tests
        run: flutter test

      - name: Validate requirements traceability
        run: python scripts/validate_contract.py

      - name: Build Windows release
        run: flutter build windows --release --no-pub

      - name: Package portable Windows test build with Arabic executable name
        shell: pwsh
        run: ./scripts/package_windows.ps1

      - name: Upload private Windows test artifact
        uses: actions/upload-artifact@v6
        with:
          name: Altamam_AlYawmi_Part_II_Windows_x64
          path: |
            artifacts/Altamam_AlYawmi_Part_II_Windows_x64.zip
            artifacts/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
